name: daily

# Robot quotidien : régénère les Top 10 et publie sur GitHub Pages, tout seul.
on:
  schedule:
    - cron: "0 16 * * *" # 18:00 en España en verano; 17:00 en invierno.
  workflow_dispatch: {} # + bouton « Run workflow » pour lancer à la main

permissions:
  contents: write # committer cache/ + public/
  pages: write # déployer sur Pages
  id-token: write # OIDC pour le déploiement Pages

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Comprobar el addon
        run: |
          bun test
          bun run typecheck
          bunx tsc --noEmit -p worker/tsconfig.json

      - name: Garantizar ImageMagick
        run: |
          if ! (magick -version || convert -version) >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

      - name: Générer les Top 10
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: bun run src/generate.ts

      - name: Vérifier
        run: bun run src/generate.ts verify

      - name: Committer l'état régénéré
        # On versionne le cache TMDB + les DONNÉES (public/data, availability, manifest, catalog).
        # Les affiches (public/posters/) sont gitignorées : régénérées à chaque run, publiées via
        # l'artefact ci-dessous, jamais committées (sinon le dépôt gonflerait de ~930 images/jour).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache public
          git commit -m "Top 10 ES 🇪🇸 — $(date -u +%F)" || { echo "Rien à committer (déjà à jour)."; exit 0; }
          # Intègre d'éventuels commits concurrents, puis pousse. Un push raté (course) ne doit PAS
          # bloquer le déploiement : les données seront re-persistées au prochain run.
          git pull --rebase origin main || true
          git push || echo "⚠️ push échoué (course concurrente) — le déploiement continue."

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
